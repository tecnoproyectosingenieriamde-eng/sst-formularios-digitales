name: Verificar compilación

on:
  push:
    branches:
      - setup/arquitectura-inicial
  pull_request:
    branches:
      - setup/arquitectura-inicial

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Comprobar TypeScript y compilar
        run: npm run build
